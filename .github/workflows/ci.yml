# Автоматические проверки Wave / «ВОЛНА» (ADR-8). Секретов и живых музыкальных источников не использует.
#
#   checks (ubuntu, windows): python tests/run_checks.py — гигиена git, compileall, pyflakes, node --check,
#                             pytest (unit + API, без сети, временный профиль), e2e в Playwright Chromium
#                             (не WebView2), проверка, что рабочий каталог не изменился. Перед этим отдельный шаг
#                             скачивает закреплённый Deno со сверкой SHA-256 (fetch_runtime.py) для тестов
#                             tests/unit/test_jsruntime_real.py; сами тесты в сеть не ходят.
#   windows-build:            (S4) настоящий build_windows.bat в чистом окружении: Python 3.12 + хэш-лок, Deno по
#                             deno.lock (SHA-256), PyInstaller, Wave.exe --diagnostics, WebView2 bootstrapper (подпись
#                             Microsoft), Inno Setup 6.7.3 (закреплён SHA-256) -> dist\installer\Wave-Setup-<версия>.exe.
#                             Затем проверки собранной папки и Wave.exe --diagnostics (S3: из пути с кириллицей, без
#                             упакованного Deno и т.д.) и установщика (tests/installer/run_installer_checks.ps1):
#                             установка для текущего пользователя и под стандартной учётной записью, запуск на WAVE_PORT,
#                             e2e против установленного приложения, второй запуск, обновление поверх, удаление с
#                             сохранением данных, тестовые сборки без WebView2. Сеть приложения в проверках закрыта.
#                             Это НЕ проверка окна WebView2 глазами и воспроизведения YouTube (ручной чек-лист S4).
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash          # и на Windows: bash -eo pipefail останавливает шаг на первой ошибке

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
            constraints.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Install Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium for Playwright (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      # Настоящий Deno для test_jsruntime_real.py: тот же скрипт и та же сверка SHA-256, что при сборке
      - name: Prepare pinned Deno for runtime tests (download + SHA-256)
        run: |
          case "$RUNNER_OS" in Windows) P=windows-x86_64; N=deno.exe;; *) P=linux-x86_64; N=deno;; esac
          T="${RUNNER_TEMP//\\//}"
          python packaging/fetch_runtime.py --platform "$P" --dest "$T/deno" --cache "$T/deno-downloads"
          echo "WAVE_TEST_REAL_DENO=$T/deno/$N" >> "$GITHUB_ENV"

      - name: Run all checks
        run: |
          # PYTEST_ADDOPTS разбирается как командная строка POSIX: обратные слэши Windows-пути нужно заменить
          export PYTEST_ADDOPTS="--junitxml=${RUNNER_TEMP//\\//}/pytest.xml"
          python tests/run_checks.py 2>&1 | tee "${RUNNER_TEMP//\\//}/run_checks.log"

      # Итог pytest (в т.ч. какие тесты пропущены), упавшие тесты и строки FAIL — аннотациями:
      # их видно на странице запуска и через API check-runs
      - name: Report results as annotations
        if: always()
        run: python tests/ci_annotate.py --summary --junit "${RUNNER_TEMP//\\//}/pytest.xml" --log "${RUNNER_TEMP//\\//}/run_checks.log"

  windows-build:
    name: windows-build (build_windows.bat, installer)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packaging/requirements-build.lock
            requirements-dev.txt
            constraints.txt

      # Inno Setup 6.7.3 (последняя 6.x): официальный файл из релиза jrsoftware/issrc, SHA-256 закреплён,
      # подпись Authenticode должна быть действительной. Ставится во временную папку, путь — через ISCC.
      - name: Install Inno Setup 6.7.3 (pinned SHA-256, valid signature)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $sha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $sha) { throw "innosetup-6.7.3.exe SHA-256 $h, expected $sha" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid") { throw "innosetup-6.7.3.exe signature: $($sig.Status) $($sig.StatusMessage)" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
          $log = Join-Path $env:RUNNER_TEMP "innosetup-install.log"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR=`"$dir`" /LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install exit code $($p.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "::notice title=Inno Setup::ISCC $((Get-Item $iscc).VersionInfo.FileVersion); installer signed by $($sig.SignerCertificate.Subject -replace ',', ';')"

      # WIN-1: тот же скрипт, что у владельца. WAVE_BUILD_PYTHON — Python 3.12 из setup-python (py launcher
      # на раннере может его не видеть); версию и разрядность проверяет verify_build_env.py.
      - name: build_windows.bat (WIN-1)
        shell: cmd
        env:
          WAVE_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          call build_windows.bat > "%RUNNER_TEMP%\build_windows.log" 2>&1
          set CODE=%ERRORLEVEL%
          type "%RUNNER_TEMP%\build_windows.log"
          exit /b %CODE%

      - name: Report build_windows.bat result
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "build_windows.log"
          if (-not (Test-Path $log)) { "::error title=build_windows.bat::no log"; exit 0 }
          $lines = Get-Content $log -Encoding utf8
          foreach ($pat in "Окружение сборки:", "Готово: Deno", "Диагностика собранного приложения", "Версия:", "Компилятор:", "Подпись:", "Готово: dist", "WebView2 bootstrapper", "ОШИБКА", "Сборка не удалась") {
            $lines | Where-Object { $_ -like "*$pat*" } | Select-Object -First 2 | ForEach-Object { "::notice title=build_windows.bat::$($_ -replace '::', ': ')" }
          }
          if ($lines -match "Сборка не удалась") { "::error title=build_windows.bat tail::$(($lines | Select-Object -Last 25) -join ' | ')" }

      - name: Check build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap { Write-Host "::error title=Check build output::$($_.Exception.Message -replace '[\r\n]+', ' | ')"; exit 1 }
          if (-not (Test-Path "dist\Wave\Wave.exe")) { throw "dist\Wave\Wave.exe not found" }
          $index = Get-ChildItem -Path "dist\Wave" -Recurse -Filter "index.html" | Where-Object { $_.Directory.Name -eq "frontend" }
          if (-not $index) { throw "frontend\index.html is not bundled" }
          $forbidden = Get-ChildItem -Path "dist\Wave" -Recurse -File -Include *.db,*.db-wal,*.db-shm,*.log,.env,cookies*.txt,*.m4a,*.mp3
          if ($forbidden) { $forbidden | ForEach-Object { $_.FullName }; throw "user data or secrets in dist" }
          # S3: упакованный Deno — ровно файл из deno.lock; lock, лицензии и скрипты yt-dlp-ejs на месте
          $lock = Get-Content "packaging\runtime\deno.lock" -Raw -Encoding utf8 | ConvertFrom-Json
          $deno = "dist\Wave\_internal\runtime\deno\deno.exe"
          if (-not (Test-Path $deno)) { throw "$deno not found" }
          $hash = (Get-FileHash $deno -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $lock.platforms.'windows-x86_64'.member_sha256) { throw "deno.exe SHA-256 $hash does not match deno.lock" }
          foreach ($f in "runtime\deno.lock", "licenses\THIRD_PARTY_NOTICES.txt", "licenses\deno\LICENSE.md", "licenses\v8\LICENSE",
                         "licenses\yt-dlp\LICENSE", "licenses\yt-dlp-ejs\LICENSE", "yt_dlp_ejs\yt\solver\core.min.js", "yt_dlp_ejs\yt\solver\lib.min.js") {
            if (-not (Test-Path "dist\Wave\_internal\$f")) { throw "$f is not bundled" }
          }
          # S4: version-resource Wave.exe совпадает с backend/version.py (единственный источник версии)
          $ver = (python backend/version.py).Trim()
          $vi = (Get-Item "dist\Wave\Wave.exe").VersionInfo
          if ($vi.ProductVersion -ne $ver -or $vi.FileVersion -ne $ver -or $vi.FileVersionRaw.ToString() -ne "$ver.0") {
            throw "Wave.exe version resource: ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion) raw=$($vi.FileVersionRaw), expected $ver"
          }
          "::notice title=Wave.exe version::$($vi.ProductName) $($vi.ProductVersion) ($($vi.CompanyName); $($vi.FileDescription))"
          # S4: перечни лицензий — Rust/V8 компонентов Deno и Python-пакетов, собранный по составу этой сборки
          foreach ($f in "licenses\deno\THIRD_PARTY_RUST.txt", "licenses\deno\V8_COMPONENTS.txt", "licenses\python\PACKAGES.txt") {
            if (-not (Test-Path "dist\Wave\_internal\$f")) { throw "$f is not bundled" }
          }
          $pk = Get-Content "dist\Wave\_internal\licenses\python\PACKAGES.txt" -Encoding utf8
          "::notice title=licenses\python\PACKAGES.txt::$(($pk | Where-Object { $_ -match ' — ' }) -join ' || ')"
          foreach ($need in "pywebview ", "pythonnet ", "fastapi ", "yt-dlp ", "Microsoft.Web.WebView2 SDK ") {
            if (-not ($pk | Where-Object { $_.StartsWith($need) })) { throw "PACKAGES.txt has no $need" }
          }
          # инструменты сборки в приложение не входят (wave.spec: excludes)
          $tools = $pk | Where-Object { $_ -match "^(PyInstaller|pyinstaller|pyinstaller-hooks-contrib|pillow|Pillow|setuptools|altgraph|pefile|pywin32-ctypes) " }
          if ($tools) { throw "build tools in the bundle: $($tools -join ' || ')" }
          $gpl = Get-ChildItem -Path "dist\Wave\_internal" -Directory -Filter "mutagen*"
          if ($gpl) { throw "mutagen (GPL) must not be bundled" }
          $mb = { param($p) (Get-ChildItem -Path $p -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB }
          $total = & $mb "dist\Wave"; $runtime = & $mb "dist\Wave\_internal\runtime"; $ejs = & $mb "dist\Wave\_internal\yt_dlp_ejs"
          "::notice title=dist\Wave size::total {0:N1} MB; runtime\deno {1:N1} MB; yt_dlp_ejs {2:N2} MB; without S3 additions {3:N1} MB" -f $total, $runtime, $ejs, ($total - $runtime - $ejs)

      # Собранный Wave.exe без окна и без сети. Оконная программа: Start-Process -Wait даёт код возврата,
      # -RedirectStandardOutput проверяет вывод через перенаправленный дескриптор (launcher._cli_stream).
      - name: Diagnostics of the built app (Wave.exe --diagnostics)
        shell: pwsh
        timeout-minutes: 10
        env:
          WAVE_DATA_DIR: ${{ runner.temp }}\wave-data
        run: |
          $ErrorActionPreference = "Stop"
          # любая ошибка шага — аннотацией (полный журнал запуска доступен не всегда)
          trap { Write-Host "::error title=diagnostics step::$($_.Exception.Message -replace '[\r\n]+', ' | ')"; exit 1 }
          $lock = Get-Content "packaging\runtime\deno.lock" -Raw -Encoding utf8 | ConvertFrom-Json
          function Evidence([string]$name) {
            # зависание: какие процессы живы, есть ли у Wave.exe окно (MessageBox), чем кончается wave.log
            $procs = Get-Process -Name Wave, deno -ErrorAction SilentlyContinue |
                     ForEach-Object { "$($_.ProcessName) pid=$($_.Id) window='$($_.MainWindowTitle)'" }
            $log = Join-Path $env:WAVE_DATA_DIR "logs\wave.log"
            $tail = if (Test-Path $log) { (Get-Content $log -Tail 20 -Encoding utf8) -join " | " } else { "no wave.log" }
            Write-Host "::error title=${name} hung::processes: $($procs -join '; ') || wave.log: $tail"
          }
          function Diag([string]$exe, [string]$name, [string]$cwd) {
            $json = Join-Path $env:RUNNER_TEMP "diag-$name.json"; $txt = Join-Path $env:RUNNER_TEMP "diag-$name.txt"
            $t = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList "--diagnostics --output `"$json`"" -WorkingDirectory $cwd `
                 -PassThru -RedirectStandardOutput $txt
            $null = $p.Handle                                   # иначе ExitCode может быть пустым
            if (-not $p.WaitForExit(90000)) {
              Evidence $name
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Get-Process -Name deno -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "${name}: Wave.exe --diagnostics did not finish in 90 s"
            }
            $t.Stop()
            $text = Get-Content $txt -Raw -Encoding utf8
            Write-Host "--- $name (exit $($p.ExitCode), $([int]$t.Elapsed.TotalMilliseconds) ms)"; Write-Host $text
            if (-not (Test-Path $json)) { Evidence $name; throw "${name}: no JSON report" }
            return @{ code = $p.ExitCode; report = (Get-Content $json -Raw -Encoding utf8 | ConvertFrom-Json); text = $text;
                      ms = [int]$t.Elapsed.TotalMilliseconds }
          }
          function AssertOk($r, [string]$name) {
            $rt = $r.report.js_runtime
            if ($r.code -ne 0) { throw "${name}: exit code $($r.code)" }
            if (-not $r.report.app.frozen) { throw "${name}: not frozen" }
            if ($rt.source -ne "bundled" -or -not $rt.ok -or $rt.version -ne $lock.version) { throw "${name}: runtime $($rt | ConvertTo-Json -Compress)" }
            if (-not $r.report.solver.usable -or $r.report.solver.ejs_version -ne $r.report.solver.builtin_version) { throw "${name}: yt-dlp-ejs not usable" }
            if ($r.report.issues.Count -ne 0) { throw "${name}: issues $($r.report.issues | ConvertTo-Json -Compress)" }
            if ($r.text -notmatch "supported=true") { throw "${name}: text report not written to redirected stdout" }
          }
          # 1) из папки сборки
          $a = Diag "dist\Wave\Wave.exe" "dist" (Get-Location).Path
          AssertOk $a "dist"
          # 2) копия в пути с пробелами и кириллицей, запуск из другого текущего каталога
          $app = Join-Path $env:RUNNER_TEMP "Мои программы\Волна Тест"
          New-Item -ItemType Directory -Force -Path (Split-Path $app) | Out-Null
          Copy-Item "dist\Wave" $app -Recurse
          $b = Diag (Join-Path $app "Wave.exe") "cyrillic" $env:RUNNER_TEMP
          AssertOk $b "cyrillic"
          if ($b.report.js_runtime.path -notlike "<app>*") { throw "path is not shown relative to the app" }
          # 3) без упакованного Deno: понятная ошибка; Deno в PATH и в текущем каталоге НЕ подхватывается
          Remove-Item (Join-Path $app "_internal\runtime\deno\deno.exe")
          $decoy = Join-Path $env:RUNNER_TEMP "decoy"; New-Item -ItemType Directory -Force -Path $decoy | Out-Null
          Copy-Item "dist\Wave\_internal\runtime\deno\deno.exe" $decoy
          $env:PATH = "$decoy;$env:PATH"
          $c = Diag (Join-Path $app "Wave.exe") "no-runtime" $decoy
          if ($c.code -ne 1) { throw "no-runtime: expected exit code 1, got $($c.code)" }
          $issue = $c.report.issues | Where-Object { $_.code -eq "js_runtime_unavailable" }
          if (-not $issue -or $issue.message -notmatch "Переустановите") { throw "no-runtime: no clear message" }
          if ($c.report.js_runtime.source -ne "bundled") { throw "no-runtime: system/cwd Deno was used" }
          # 4) команды из README и build_windows.bat возвращают код возврата и не зависают
          #    (каждая — в отдельном задании с таймаутом: зависание видно аннотацией, а не таймаутом job)
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -ne $decoy }) -join ";"
          $root = (Get-Location).Path
          function TimedJob([scriptblock]$sb, [string]$name) {
            $j = Start-Job -ScriptBlock $sb -ArgumentList $root
            if (-not (Wait-Job $j -Timeout 90)) {
              Evidence $name; Stop-Job $j
              Get-Process -Name Wave, deno -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "${name}: did not return in 90 s"
            }
            return (Receive-Job $j | Out-String).Trim()
          }
          $r1 = TimedJob { param($r) Set-Location $r; cmd /v:on /c 'start "" /wait "dist\Wave\Wave.exe" --diagnostics & echo exit=!errorlevel!' } "cmd start /wait"
          if ($r1 -notmatch "exit=0") { throw "cmd start /wait: $r1" }
          $r2 = TimedJob { param($r) Set-Location $r; (Start-Process -FilePath "dist\Wave\Wave.exe" -ArgumentList "--diagnostics" -Wait -PassThru).ExitCode } "Start-Process -Wait"
          if ($r2 -ne "0") { throw "Start-Process -Wait: exit code '$r2'" }
          $r3 = TimedJob { param($r) Set-Location $r; $o = Join-Path $env:RUNNER_TEMP "diag-wait-redirect.txt"
                           $p = Start-Process -FilePath "dist\Wave\Wave.exe" -ArgumentList "--diagnostics" -Wait -PassThru -RedirectStandardOutput $o
                           $text = Get-Content $o -Raw -Encoding utf8          # пустой файл -> $null
                           $has = "$text" -match "supported=true"
                           $log = Join-Path $env:WAVE_DATA_DIR "logs\wave.log"
                           $tail = if (Test-Path $log) { (Get-Content $log -Tail 12 -Encoding utf8) -join " | " } else { "no wave.log" }
                           "exit=$($p.ExitCode) text=$has log: $tail" } "Start-Process -Wait -RedirectStandardOutput"
          Write-Host "::notice title=Start-Process -Wait -RedirectStandardOutput::$($r3 -replace '[\r\n]+', ' | ')"
          # именно здесь первоначально зависал шаг: stdout в cp1252 -> UnicodeEncodeError -> MessageBox (исправлено)
          if ($r3 -notmatch "^exit=0 text=True") { throw "Start-Process -Wait -RedirectStandardOutput: $r3" }
          # 5) после всех запусков не осталось процессов deno.exe
          Start-Sleep -Seconds 1
          $left = Get-Process -Name deno -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, Path; throw "deno.exe processes left after Wave.exe exited" }
          "::notice title=Wave.exe --diagnostics::bundled deno $($a.report.js_runtime.version) supported; yt-dlp $($a.report.yt_dlp.version); yt-dlp-ejs $($a.report.solver.ejs_version); runs: dist $($a.ms) ms, Cyrillic path $($b.ms) ms (OK), missing runtime $($c.ms) ms (exit 1, clear message, PATH/cwd Deno ignored); README commands (cmd start /wait, Start-Process -Wait, also with -RedirectStandardOutput) return exit 0; no deno.exe left"

      # WIN-3: те же файлы, но установщик считает WebView2 отсутствующим и вместо bootstrapper выполняет
      # «cmd /c exit 0|1603». Компилируется отдельно (/DTestWebView2), выпускаемый установщик этого кода не содержит.
      - name: Compile test installers without WebView2 (WIN-3)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = (python backend/version.py).Trim()
          $out = Join-Path $env:RUNNER_TEMP "wv-test"
          foreach ($mode in "ok", "fail") {
            & $env:ISCC /Qp "/DAppVersion=$v" "/DTestWebView2=$mode" "/O$out" "/FWave-Setup-$v-webview2-$mode" installer\wave.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC TestWebView2=$mode exit $LASTEXITCODE" }
          }
          Get-ChildItem $out | ForEach-Object { "::notice title=test installer::$($_.Name) {0:N1} MB" -f ($_.Length / 1MB) }

      - name: Test environment for e2e (Playwright Chromium)
        run: |
          python -m venv "$RUNNER_TEMP/venv-tests"
          T="${RUNNER_TEMP//\\//}/venv-tests/Scripts/python.exe"
          "$T" -m pip install -r requirements-dev.txt -c constraints.txt
          "$T" -m playwright install chromium

      - name: Installer checks (WIN-2, 3, 4, 8, 9, 13, 15)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $v = (python backend/version.py).Trim()
          $t = Join-Path $env:RUNNER_TEMP "wv-test"
          pwsh -NoProfile -File tests\installer\run_installer_checks.ps1 -Installer "dist\installer\Wave-Setup-$v.exe" `
            -TestInstallerOk "$t\Wave-Setup-$v-webview2-ok.exe" -TestInstallerFail "$t\Wave-Setup-$v-webview2-fail.exe" `
            -Python "$env:RUNNER_TEMP\venv-tests\Scripts\python.exe" -Work "$env:RUNNER_TEMP\s4" -Results "$env:RUNNER_TEMP\s4-installer-results.json"
          exit $LASTEXITCODE

      # Лицензия Microsoft WebView2 SDK (библиотеки внутри pywebview): версия DLL в сборке совпадает с
      # licenses/webview2-sdk/VERSION, текст — с файлом лицензии официального пакета NuGet этой версии
      - name: WebView2 SDK license matches the official NuGet package
        if: ${{ !cancelled() && hashFiles('dist/Wave/Wave.exe') != '' }}     # и после сбоя проверок установщика
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content licenses\webview2-sdk\VERSION -Raw).Trim()
          $dll = Get-ChildItem dist\Wave\_internal -Recurse -Filter Microsoft.Web.WebView2.Core.dll | Select-Object -First 1
          if (-not $dll) { throw "Microsoft.Web.WebView2.Core.dll is not in dist\Wave" }
          if ($dll.VersionInfo.FileVersion -ne $ver) { throw "WebView2 SDK in dist is $($dll.VersionInfo.FileVersion), licenses/webview2-sdk/VERSION says $ver" }
          $pkg = Join-Path $env:RUNNER_TEMP "microsoft.web.webview2.$ver.nupkg"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $pkg
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
          $entry = $zip.Entries | Where-Object { $_.FullName -match '^LICENSE' } | Select-Object -First 1
          if (-not $entry) { $names = ($zip.Entries | Select-Object -First 30 | ForEach-Object FullName) -join ', '; $zip.Dispose(); throw "no LICENSE in nupkg: $names" }
          $reader = [IO.StreamReader]::new($entry.Open()); $text = $reader.ReadToEnd(); $reader.Dispose(); $zip.Dispose()
          $norm = { param($t) (($t -replace "`r`n", "`n") -split "`n" | ForEach-Object { $_.TrimEnd() }) -join "`n" | ForEach-Object { $_.Trim() } }
          $mine = if (Test-Path licenses\webview2-sdk\LICENSE.txt) { Get-Content licenses\webview2-sdk\LICENSE.txt -Raw -Encoding utf8 } else { "" }
          if ((& $norm $mine) -ne (& $norm $text)) {
            "::error title=WebView2 SDK license differs from NuGet $ver ($($entry.FullName))::$(($text -replace "`r?`n", ' ¶ '))"
            exit 1
          }
          "::notice title=WebView2 SDK license::Microsoft.Web.WebView2 $ver — licenses/webview2-sdk/LICENSE.txt matches $($entry.FullName) of the NuGet package"
