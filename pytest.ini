[pytest]
# Unit- и API-тесты Wave. Запуск:  python -m pytest
# Браузерный e2e (tests/e2e_smoke.py) запускается отдельно: python tests/run_e2e.py
testpaths = tests
python_files = test_*.py
# importlib: одинаковые имена модулей в tests/unit и tests/api не конфликтуют;
# без cacheprovider pytest ничего не пишет в репозиторий; live-тесты — только явно (-m live).
addopts = -ra --strict-markers --import-mode=importlib -p no:cacheprovider -m "not live"
xfail_strict = true
markers =
    live: обращается к живым музыкальным источникам; по умолчанию выключен, запуск: python -m pytest -m live
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    # Starlette 1.x советует httpx2 для TestClient; тесты используют закреплённый httpx 0.28 (constraints.txt)
    ignore:Using `httpx` with `starlette.testclient` is deprecated
